name: Research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_publication.py
      - run: python tools/reproduce.py --quick --out runs/ci-smoke
      - run: python experiments/stage52/run.py --quick --out runs/ci-stage52
      - run: python experiments/stage52/followup.py --quick --out runs/ci-stage53
      - run: python experiments/stage52/blind_spot.py --quick --out runs/ci-stage54
      - run: python experiments/stage55_60/run55.py --quick --out runs/ci-stage55
      - run: python experiments/stage55_60/run56.py --quick --out runs/ci-stage56
      - run: python experiments/stage55_60/run57.py --quick --out runs/ci-stage57
      - run: python experiments/stage55_60/run58.py --quick --out runs/ci-stage58
      - run: python experiments/stage55_60/run59.py --quick --out runs/ci-stage59
      - run: python experiments/stage55_60/run60.py --quick --out runs/ci-stage60
      - run: python experiments/roadmap_resolution/run119.py --quick --out runs/ci-stage119
      - run: python experiments/roadmap_resolution/run120.py --quick --out runs/ci-stage120
      - run: python experiments/roadmap_resolution/run121.py --quick --out runs/ci-stage121
      - run: python experiments/roadmap_resolution/run122.py --quick --out runs/ci-stage122
      - run: python experiments/roadmap_resolution/benchmark124.py --quick --out runs/ci-stage124
      - run: python experiments/roadmap_resolution/benchmark125.py --quick --out runs/ci-stage125
