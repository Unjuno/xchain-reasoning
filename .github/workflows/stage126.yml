name: Stage 126 runtime experiment
on:
  push:
    branches: ['research/stage126-runtime-frontier']
    paths:
      - 'experiments/stage126/**'
      - '.github/workflows/stage126.yml'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_publication.py
      - run: python experiments/stage126/strict_controls.py --quick --out runs/stage126-smoke
      - run: python experiments/stage126/strict_controls.py --out runs/stage126
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stage126-runtime-frontier
          path: |
            runs/stage126/*.csv
            runs/stage126/*.json
            runs/stage126/*.npz
            runs/stage126-smoke/*.json
            experiments/stage126/
          if-no-files-found: error
          retention-days: 30
