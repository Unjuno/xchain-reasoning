name: Stage 126 artifact audit
on:
  push:
    branches: ['research/stage126-runtime-frontier']
    paths:
      - 'tools/audit_stage126.py'
      - '.github/workflows/stage126-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stage126-runtime-frontier
          run-id: '36137287383'
          github-token: ${{ github.token }}
          path: runs/downloaded-stage126
      - run: python tools/audit_stage126.py --data runs/downloaded-stage126/runs/stage126 --out runs/stage126-independent-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stage126-independent-audit
          path: runs/stage126-independent-audit/
          if-no-files-found: error
          retention-days: 30
